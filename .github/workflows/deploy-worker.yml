name: Deploy Worker

# The Cloudflare Worker had no deploy automation at all -- unlike the
# frontend (Cloudflare Pages Git integration, configured on Cloudflare's
# side) and the data pipeline (direct D1/KV API calls from refresh.yml),
# worker/src/index.ts and wrangler.toml changes only ever reached
# production via someone manually running `wrangler deploy`. This closes
# that gap: deploy on every push to master that touches worker/, plus a
# manual trigger for one-off redeploys.

on:
  push:
    branches: [master]
    paths:
      - "worker/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Install dependencies
        working-directory: worker
        run: npm ci

      - name: Type-check
        working-directory: worker
        run: npm run type-check

      - name: Deploy
        working-directory: worker
        # wrangler deploy uploads the script successfully, then makes an
        # unrelated informational call (GET /accounts/.../workers/subdomain,
        # to print the workers.dev URL) that 401s with this narrowly-scoped
        # token and makes wrangler exit 1 even though the actual deploy
        # already succeeded. Treat "Uploaded <name>" in the output as the
        # real success signal instead of trusting wrangler's exit code --
        # a genuine deploy failure (bad code, real auth failure before
        # upload, network error) would never print that line.
        run: |
          set +e
          OUTPUT=$(npx wrangler deploy 2>&1)
          STATUS=$?
          echo "$OUTPUT"
          if echo "$OUTPUT" | grep -q "Uploaded rolelens-worker"; then
            exit 0
          fi
          exit $STATUS
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
