name: Refresh role and task data

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

# Least privilege: read-only by default; the refresh job below requests the
# write + OIDC scopes it actually needs.
permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      id-token: write # MANDATORY: Allows GitHub to request the OIDC token from Entra
      security-events: read # read Trivy code-scanning alerts for the app's security strip

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Azure Login
        uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true # Essential since you are only accessing Graph API

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install dependencies
        run: pip install --require-hashes -r pipeline/requirements.txt

      - name: Fetch roles
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: python pipeline/fetch_roles.py

      - name: Scrape task-to-role mappings
        run: python pipeline/scrape_tasks.py

      - name: Diff roles
        run: python pipeline/diff_roles.py

      - name: Generate role scenarios (AI, best-effort)
        continue-on-error: true
        run: python pipeline/generate_scenarios.py
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Enrich
        run: python pipeline/enrich.py

      - name: Validate
        run: python pipeline/validate.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}

      - name: Role task-coverage report
        run: python pipeline/coverage_report.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}

      - name: Security scan summary
        run: python pipeline/security_summary.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}

      - name: Push to Cloudflare KV and D1
        run: python pipeline/push_to_cloudflare.py
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_KV_NAMESPACE_ID: ${{ secrets.CLOUDFLARE_KV_NAMESPACE_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}

      - name: Run pill integration tests
        id: pill_tests
        continue-on-error: true
        run: python pipeline/test_pills.py
        env:
          WORKER_URL: ${{ secrets.ROLELENS_WORKER_URL }}

      - name: Synonym expansion regression check
        continue-on-error: true
        run: python pipeline/test_synonym_regression.py
        env:
          WORKER_URL: ${{ secrets.ROLELENS_WORKER_URL }}

      # Only fires when test_pills.py exits 1, which now means a NEW
      # regression rather than any failure. Known failures are
      # suppressed via KNOWN_FAILURES in pipeline/test_pills.py.
      - name: Open issue on pill regression
        if: steps.pill_tests.outcome == 'failure'
        run: |
          gh issue create \
            --title "Pill regression detected in nightly run $(date +%Y-%m-%d)" \
            --body "The nightly pipeline detected that one or more documented pill queries no longer return the expected top result. Check the Actions log for the specific failures and investigate before the next deploy." \
            --label "bug,pill-regression"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push data to master
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ README.md
          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "data: nightly refresh [skip ci]"
          # Set push credentials (persist-credentials: false means no header was pre-set)
          git config "http.https://github.com/.extraheader" "AUTHORIZATION: basic $(echo -n "x-access-token:${GH_PUSH_TOKEN}" | base64 -w 0)"
          # Rebase onto latest master; -X ours keeps pipeline-generated data on conflict
          # (public repo — fetch needs no credentials)
          git fetch origin master
          git rebase -X ours origin/master || {
            git rebase --abort
            echo "Rebase failed — force-pushing since pipeline data is authoritative"
            git push --force-with-lease origin master
            exit 0
          }
          git push origin master
        env:
          GH_PUSH_TOKEN: ${{ secrets.GH_PUSH_TOKEN }}
